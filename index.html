        <button id="btn-speed" type="button" class="hud-btn">1x</button>
        <button id="btn-sound" type="button" class="hud-btn" title="Toggle Sound">🔊</button>
        <button id="btn-pause" type="button" class="hud-btn" title="Pause">⏸</button>
      </div>
    </div>

    <!-- Playable Canvas Area -->
    <div id="stage-wrap" class="stage-wrap">
      <canvas id="gameCanvas"></canvas>

      <!-- Live Event Banner -->
      <div id="event-banner" class="event-banner"></div>

      <!-- Stage Intro Modal -->
      <div id="intro-modal" class="modal-backdrop active">
        <div class="modal-card">
          <div id="intro-badge" class="diff-badge diff-TRAINING" style="margin-bottom:4px;">STAGE 1 • TRAINING</div>
          <div id="intro-title" style="font-size:18px;font-weight:900;margin-bottom:4px;">Coral Bay</div>
          <div id="intro-sub" style="font-size:12px;color:#475569;margin-bottom:10px;">1 Coastal Runway</div>
          <div id="intro-tip" style="font-size:12px;color:#0f172a;background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:9px;margin-bottom:12px;line-height:1.45;text-align:left;"></div>
          <div style="display:flex;flex-direction:column;gap:7px;">
            <button id="btn-start-stage" type="button" class="primary-btn">Start Stage 1</button>
            <button id="btn-open-map" type="button" class="secondary-btn">Choose Another Stage (1–11)</button>
          </div>
        </div>
      </div>

      <!-- Stage Select Modal (All 11 Stages + Dev Unlock All Toggle) -->
      <div id="stage-select-modal" class="modal-backdrop">
        <div class="modal-card wide">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px;">
            <div>
              <div style="font-size:16px;font-weight:900;">Runway Control — 11 Stages</div>
              <div id="total-stars-label" style="font-size:11px;color:#64748b;">★ 0 / 33 Stars</div>
            </div>
            <div style="display:flex;gap:6px;align-items:center;">
              <button id="btn-unlock-all" type="button" class="secondary-btn" style="width:auto;padding:5px 9px;font-size:11px;">
                🔓 Unlock All
              </button>
              <button id="btn-close-map" type="button" class="secondary-btn" style="width:auto;padding:5px 9px;font-size:11px;">
                ✕
              </button>
            </div>
          </div>
          <div id="stage-grid" class="stage-grid"></div>
        </div>
      </div>

      <!-- Stage Clear Modal -->
      <div id="clear-modal" class="modal-backdrop">
        <div class="modal-card">
          <div id="clear-stars" style="font-size:24px;letter-spacing:4px;color:#eab308;margin-bottom:2px;">★★★</div>
          <div id="clear-title" style="font-size:18px;font-weight:900;color:#059669;margin-bottom:4px;">STAGE CLEARED!</div>
          <div id="clear-sub" style="font-size:12px;color:#475569;margin-bottom:10px;"></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
            <div style="background:#ecfdf5;border:1px solid #a7f3d0;border-radius:10px;padding:8px;">
              <div style="font-size:10px;color:#047857;font-weight:700;">SCORE</div>
              <div id="clear-score" style="font-size:18px;font-family:monospace;font-weight:900;color:#065f46;">0</div>
            </div>
            <div style="background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:8px;">
              <div style="font-size:10px;color:#0369a1;font-weight:700;">LANDINGS</div>
              <div id="clear-landings" style="font-size:18px;font-family:monospace;font-weight:900;color:#0c4a6e;">10</div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:7px;">
            <button id="btn-next-stage" type="button" class="primary-btn">Next Stage →</button>
            <button id="btn-endless" type="button" class="secondary-btn">Continue Endless Rush</button>
            <button id="btn-replay-clear" type="button" class="secondary-btn">Replay Stage</button>
          </div>
        </div>
      </div>

      <!-- Game Over Modal -->
      <div id="gameover-modal" class="modal-backdrop">
        <div class="modal-card">
          <div style="font-size:18px;font-weight:900;color:#dc2626;margin-bottom:4px;">AIRSPACE CRITICAL</div>
          <div id="over-reason" style="font-size:12px;color:#475569;margin-bottom:10px;">All 3 lives lost.</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
            <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:8px;">
              <div style="font-size:10px;color:#64748b;font-weight:700;">SCORE</div>
              <div id="over-score" style="font-size:18px;font-family:monospace;font-weight:900;">0</div>
            </div>
            <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:8px;">
              <div style="font-size:10px;color:#64748b;font-weight:700;">LANDINGS</div>
              <div id="over-landings" style="font-size:18px;font-family:monospace;font-weight:900;">0</div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:7px;">
            <button id="btn-retry" type="button" class="primary-btn">Try Again</button>
            <button id="btn-over-map" type="button" class="secondary-btn">Stage Select</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Compact ATC Bottom Line -->
    <div class="bottom-bar">
      <div class="atc-line">
        <span class="tower-tag">TOWER</span>
        <span id="atc-message">Coral Bay online.</span>
      </div>
      <div style="flex-shrink:0;font-variant-numeric:tabular-nums;">
        <span id="active-count">0 active</span> · Best <span id="best-val">0</span>
      </div>
    </div>
  </div>

</body>
</html>
